    <script type="text/javascript" src="cordova.js"></script>
    <!--
        Android's native Capacitor bridge (injected as part of cordova.js's
        response, see JSExport.java) only sets up a bare
        window.Capacitor = { Plugins: {} } skeleton -- registerPlugin(),
        isNativePlatform(), and the full addListener-capable plugin proxy
        system live in @capacitor/core's own JS, which a normal Capacitor
        app gets bundled in automatically by its build tool. This app has
        no bundler, so it's vendored directly (see mobile/node_modules/
        @capacitor/core/dist/capacitor.js) and loaded here, after cordova.js
        so it safely extends the existing window.Capacitor rather than
        replacing it. Harmless on desktop/PWA builds: window.Capacitor
        never gets created there, so this becomes a no-op.
    -->
    <script type="text/javascript" src="js/libraries/capacitor-core.js"></script>
    <script type="text/javascript" src="js/startup.js"></script>
    <!-- GA -->
    <div class="modal-overlay" style="display:none"></div>
	<div class="modal" style="display:none">
	    <script>
            $(document).ready(function () { 
            	if (isNative()) {
            		nw.Window.get().on('new-win-policy', function (frame, url, policy) { policy.ignore(); nw.Shell.openExternal(url); }); 
            	}
            });
        </script>
		<div class="modal-content">
			<div class="modal-body" >
				<p class="header">This GUI version is outdated.</p>
				Click download button to update to the new version. 
			</div>
			<div class="modal-footer"><a class="update-download u-button" href="https://github.com/KissUltra/gui/releases/latest" target="_blank">Download</a></div>
		</div>
	</div>

	<script type="text/javascript">
		// Only the GitHub Pages web/PWA build benefits from a service worker
		// (offline caching). Inside the Capacitor app, Capacitor's own
		// WebViewLocalServer already serves every asset locally from the APK,
		// so there's nothing for a service worker to add -- only a real
		// hazard, since a registered SW's cache persists across `adb install -r`
		// reinstalls (app data isn't cleared by a reinstall), meaning it can
		// keep serving stale JS from an old build indefinitely otherwise.
		if (('serviceWorker' in navigator) && !isNative() && !isCapacitorNative()) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('./sw.js').catch(function (error) {
					console.log('Service worker registration failed: ' + error.message);
				});
			});
		}

		// Standalone diagnostic: shows exactly what navigator.usb sees, with no
		// vendor/product filter at all, so connection problems can be told apart
		// (device invisible to WebUSB entirely vs. visible but not matching our
		// expected IDs) without needing a PC for remote debugging.
		if (!isNative() && (typeof navigator.usb !== 'undefined')) {
			var usbDiagLink = document.getElementById('usb_diag');
			usbDiagLink.addEventListener('click', async function (e) {
				e.preventDefault();
				try {
					var device = await navigator.usb.requestDevice({ filters: [] });
					var lines = [];
					lines.push('name: ' + (device.productName || '(none)'));
					lines.push('manufacturer: ' + (device.manufacturerName || '(none)'));
					lines.push('vendorId: 0x' + device.vendorId.toString(16));
					lines.push('productId: 0x' + device.productId.toString(16));
					(device.configurations || []).forEach(function (cfg, ci) {
						(cfg.interfaces || []).forEach(function (iface) {
							(iface.alternates || []).forEach(function (alt) {
								lines.push('config ' + ci + ' interface ' + iface.interfaceNumber +
									': class=0x' + alt.interfaceClass.toString(16) +
									' subclass=0x' + alt.interfaceSubclass.toString(16) +
									' protocol=0x' + alt.interfaceProtocol.toString(16) +
									' endpoints=' + alt.endpoints.length);
							});
						});
					});
					alert(lines.join('\n'));
				} catch (error) {
					alert('USB diagnose failed: ' + error.name + ': ' + error.message);
				}
			});
		} else {
			var usbDiagLinkHide = document.getElementById('usb_diag');
			if (usbDiagLinkHide) usbDiagLinkHide.style.display = 'none';
		}

		// Unregisters the service worker and clears its caches from inside the
		// page itself, since chrome://serviceworker-internals is unusable on
		// mobile (no per-origin search, lists every site's workers at once).
		if ('serviceWorker' in navigator) {
			document.getElementById('reset_cache').addEventListener('click', async function (e) {
				e.preventDefault();
				try {
					var regs = await navigator.serviceWorker.getRegistrations();
					for (var i = 0; i < regs.length; i++) await regs[i].unregister();
					if ('caches' in window) {
						var keys = await caches.keys();
						for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
					}
					alert('Cleared ' + regs.length + ' service worker(s) and their caches.\nNow fully close this tab and reopen the page.');
				} catch (error) {
					alert('Reset failed: ' + error.name + ': ' + error.message);
				}
			});
		}

		// Runs automatically on load (no button, no user interaction needed)
		// so this can be pulled from `adb logcat` without touching the phone --
		// the app's own WebView devtools bridge doesn't serve its /json
		// discovery endpoint on this device, so this is the only remaining way
		// to see the real Capacitor/plugin state directly.
		if (isCapacitorNative()) {
			try {
				var diag = {
					typeofCapacitor: typeof Capacitor,
					typeofRegisterPlugin: typeof Capacitor.registerPlugin,
					typeofPlugins: typeof Capacitor.Plugins,
					pluginKeys: Capacitor.Plugins ? Object.keys(Capacitor.Plugins) : null,
					pluginHeaderNames: Capacitor.PluginHeaders ? Capacitor.PluginHeaders.map(function (p) { return p.name; }) : 'no PluginHeaders',
					existingKissSerial: Capacitor.Plugins && Capacitor.Plugins.KissSerial ? {
						typeofConnect: typeof Capacitor.Plugins.KissSerial.connect,
						typeofAddListener: typeof Capacitor.Plugins.KissSerial.addListener
					} : 'Plugins.KissSerial not present'
				};
				try {
					var resolved = getKissSerialPlugin();
					diag.getKissSerialPluginResult = {
						typeofConnect: typeof resolved.connect,
						typeofAddListener: typeof resolved.addListener,
						sameObjectAsPluginsEntry: resolved === (Capacitor.Plugins && Capacitor.Plugins.KissSerial)
					};
				} catch (innerError) {
					diag.getKissSerialPluginResult = 'threw: ' + innerError.message;
				}
				console.log('CAPACITOR_DIAG ' + JSON.stringify(diag));
			} catch (error) {
				console.log('CAPACITOR_DIAG failed to run: ' + error.message);
			}
		}
	</script>
